---
# systemd-timesyncd tasks file for sshockley.local

- name: 'timesyncd | Gather service facts'
  ansible.builtin.service_facts:

- name: 'timesyncd | Stop and disable chrony'
  become: true
  ansible.builtin.service:
    name: '{{ chrony_service }}'
    state: stopped
    enabled: false
  when: (chrony_service ~ '.service') in ansible_facts.services

- name: 'timesyncd | Install systemd-timesyncd'
  when: timesyncd_package | length > 0
  block:
    - name: 'timesyncd | Install package'
      become: true
      ansible.builtin.package:
        name: '{{ timesyncd_package }}'
        state: present
  rescue:
    - name: 'timesyncd | Report install failure'
      ansible.builtin.fail:
        msg: >-
          Could not install {{ timesyncd_package }}.
          {{ 'On EL, systemd-timesyncd comes from EPEL; enable EPEL first.' if ansible_facts['os_family'] == 'RedHat' else '' }}

- name: 'timesyncd | Create drop-in directory'
  become: true
  ansible.builtin.file:
    path: '{{ timesyncd_config | dirname }}'
    state: directory
    owner: root
    group: root
    mode: u=rwx,g=rx,o=rx

- name: 'timesyncd | Configure systemd-timesyncd'
  become: true
  ansible.builtin.template:
    src: 'timesyncd.conf.j2'
    dest: '{{ timesyncd_config }}'
    owner: root
    group: root
    mode: u=rw,g=r,o=r
  notify: Restart systemd-timesyncd

- name: 'timesyncd | Enable and start systemd-timesyncd'
  become: true
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: started
    enabled: true
