---
# vars file for sshockley.local

# Per-OS-family time sync facts; referenced by defaults so they stay overridable
_time_sync_os:
  Debian:
    chrony_package: chrony
    chrony_service: chrony
    chrony_config: /etc/chrony/chrony.conf
    timesyncd_package: systemd-timesyncd
  RedHat:
    chrony_package: chrony
    chrony_service: chronyd
    chrony_config: /etc/chrony.conf
    timesyncd_package: systemd-timesyncd  # EL requires EPEL
  Suse:
    chrony_package: chrony
    chrony_service: chronyd
    chrony_config: /etc/chrony.conf
    timesyncd_package: systemd  # timesyncd ships inside systemd
  Alpine:
    chrony_package: chrony
    chrony_service: chronyd
    chrony_config: /etc/chrony/chrony.conf
    timesyncd_package: ""  # no systemd

_time_sync: "{{ _time_sync_os[ansible_os_family] | default(_time_sync_os['RedHat']) }}"
