---
# handlers file for sshockley.local

# Time sync service management

- name: Restart chrony
  become: true
  ansible.builtin.service:
    name: "{{ chrony_service }}"
    state: restarted

- name: Restart systemd-timesyncd
  become: true
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: restarted
